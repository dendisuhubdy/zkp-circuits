[package]
name = "recursion"
version = "0.1.0"
edition = "2021"
description = "Rand recursion VM (rVM): a field-native machine whose programs verify Rand zkVM proofs"
license = "GPL-3.0-only"

[lib]
path = "src/lib.rs"

[dependencies]
# Exactly research's pins; the rVM shares the field, the permutation and the proof system.
p3-goldilocks = "=0.7.0"
p3-field = "=0.7.0"
p3-symmetric = "=0.7.0"
p3-challenger = "=0.7.0"
p3-poseidon2 = "=0.7.0"
p3-air = "=0.7.0"
p3-batch-stark = "=0.7.0"
p3-lookup = "=0.7.0"
p3-uni-stark = "=0.7.0"
p3-fri = "=0.7.0"
p3-dft = "=0.7.0"
p3-merkle-tree = "=0.7.0"
p3-commit = "=0.7.0"
p3-matrix = "=0.7.0"
p3-util = "=0.7.0"
# HCS-1 (2026-09-27 zkVM review): exact pins, not carets. Every verifier key's preprocessed
# commitment is salted from `StdRng::seed_from_u64(KEY_SEED)` (`machine::key_config`, here and in `research/`), and `rand`
# documents `StdRng`'s stream as free to change between releases — a node built against another
# `rand` would compute different keys and refuse every proof. The stream is `rand`'s `StdRng`
# (ChaCha12 from `chacha20`), seeded through `rand_core`'s `SeedableRng::seed_from_u64`, so all
# three are pinned; `rand_core`/`chacha20` are named here only for the pin. `tests/verifier_key.rs`
# (here and in `research/`) is the tripwire: a changed stream changes its pinned digests. The stable, `rand`-free derivation
# the next chain cut switches to is `key_derivation_v2`.
rand = { version = "=0.10.2", features = ["std_rng"] }
rand_core = "=0.10.1"
chacha20 = { version = "=0.10.2", default-features = false }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
# The reference verifier this crate's first program mirrors, the reference permutation it hashes
# with, the Chip AIRs its constraint emitter walks, and the bundle guest its fixtures prove.
rand_zkvm = { path = "../research" }
# The GPU (CUDA) and CPU-twin NTT/Poseidon2-Merkle engines the proving backends run on —
# research's dependency, consumed as-is (M5.4 R1: the rVM's shapes need no new kernels).
rand-zkvm-cuda = { path = "../rand-zkvm-cuda", optional = true }

[dev-dependencies]
hex = "0.4"

[features]
# `rand-zkvm-cuda`'s CPU-twin engines (the reference backend). Research's feature, mirrored.
reference-backend = ["dep:rand-zkvm-cuda"]
# `cuda` and `mock-cuda` are mutually exclusive: enabling both is a hard `compile_error!` in
# rand-zkvm-cuda, so the host mock can never be silently substituted for the GPU.
# `Backend::Cuda` against a real device. Pulls `cuda-core`, which needs a CUDA 13 toolkit
# (`rand-zkvm-cuda/ptx/PTX_BUILD.md`): a fleet-GPU-node build, never this box's.
cuda = ["dep:rand-zkvm-cuda", "rand-zkvm-cuda/cuda"]
# Deliberately *not* `["cuda", ...]` — `rand-zkvm-cuda/cuda` is what pulls `cuda-core`, so
# enabling it would put a CUDA toolkit back in the way of a no-GPU test run. The two features
# exercise the identical `Backend::Cuda` path.
mock-cuda = ["dep:rand-zkvm-cuda", "rand-zkvm-cuda/mock-driver"]

# `research`'s profiles, verbatim. This crate is its own package root, so cargo reads *these*
# tables and not `research/`'s — and without the dependency override every p3 crate and
# `rand_zkvm` itself would build at `opt-level = 0` under `cargo test`, which makes proving a
# fixture bundle proof (the only proofs this crate's tests verify) take hours instead of seconds.
[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 1
