[package]
name = "rand-zkvm-cuda"
version = "0.1.0"
edition = "2021"
description = "GPU (CUDA) NTT and Poseidon2 Merkle backends for the Rand zkVM, with CPU reference twins"

[lib]
name = "rand_zkvm_cuda"
path = "src/lib.rs"

[dependencies]
p3-field = "=0.7.0"
p3-dft = "=0.7.0"
p3-matrix = "=0.7.0"
p3-commit = "=0.7.0"
p3-merkle-tree = "=0.7.0"
p3-goldilocks = "=0.7.0"
p3-poseidon2 = "=0.7.0"
p3-symmetric = "=0.7.0"
p3-util = "=0.7.0"
# HCS-1 (2026-09-27 zkVM review): exact pins, not carets — `research/`'s, verbatim, because this
# crate's `HidingMmcs` draws the same salts through the same `StdRng` on the GPU/reference path. Every verifier key's preprocessed
# commitment is salted from `StdRng::seed_from_u64(KEY_SEED)` (`machine::key_config`), and `rand`
# documents `StdRng`'s stream as free to change between releases — a node built against another
# `rand` would compute different keys and refuse every proof. The stream is `rand`'s `StdRng`
# (ChaCha12 from `chacha20`), seeded through `rand_core`'s `SeedableRng::seed_from_u64`, so all
# three are pinned; `rand_core`/`chacha20` are named here only for the pin. `research/tests/verifier_key.rs`
# is the tripwire: a changed stream changes its pinned digests. The stable, `rand`-free derivation
# the next chain cut switches to is `key_derivation_v2`.
rand = { version = "=0.10.2", features = ["std_rng"] }
rand_core = "=0.10.1"
chacha20 = { version = "=0.10.2", default-features = false }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
cuda-core = { version = "=0.3.1", optional = true }

[features]
default = []
# `cuda` and `mock-driver` are mutually exclusive: enabling both is a `compile_error!` in
# src/gpu/driver/mod.rs rather than a silent fallback to the host mock.
cuda = ["dep:cuda-core"]
mock-driver = []
cuda-hw = ["cuda"]

[dev-dependencies]
p3-fri = "=0.7.0"
postcard = { version = "1", features = ["alloc"] }
