[package]
name = "rand-zkvm-cuda"
version = "0.1.0"
edition = "2021"
description = "GPU (CUDA) NTT and Poseidon2 Merkle backends for the Rand zkVM, with CPU reference twins"

[lib]
name = "rand_zkvm_cuda"
path = "src/lib.rs"

[dependencies]
p3-field = "=0.7.0"
p3-dft = "=0.7.0"
p3-matrix = "=0.7.0"
p3-commit = "=0.7.0"
p3-merkle-tree = "=0.7.0"
p3-goldilocks = "=0.7.0"
p3-poseidon2 = "=0.7.0"
p3-symmetric = "=0.7.0"
p3-util = "=0.7.0"
# HCS-1 (2026-09-27 zkVM review): exact pins, not carets — `research/`'s, verbatim. Through
# constraint set 6 this crate's `HidingMmcs` drew a verifier key's salts through `StdRng` on the
# GPU/reference path, exactly as `research/`'s `machine::key_config` did, so `rand`'s stream was
# consensus. Constraint set 7 makes `HidingMmcs` generic over its salt generator and `research/`
# hands it `SaltRng`, whose key streams are `key_derivation_v2`'s — so no key depends on `rand`; the
# pins stay for proving's salts and cost nothing. `research/tests/verifier_key.rs` pins the keys.
rand = { version = "=0.10.2", features = ["std_rng"] }
rand_core = "=0.10.1"
chacha20 = { version = "=0.10.2", default-features = false }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
cuda-core = { version = "=0.3.1", optional = true }

[features]
default = []
# `cuda` and `mock-driver` are mutually exclusive: enabling both is a `compile_error!` in
# src/gpu/driver/mod.rs rather than a silent fallback to the host mock.
cuda = ["dep:cuda-core"]
mock-driver = []
cuda-hw = ["cuda"]

[dev-dependencies]
p3-fri = "=0.7.0"
postcard = { version = "1", features = ["alloc"] }
