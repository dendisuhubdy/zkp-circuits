[package]
name = "rand-zkvm-cuda"
version = "0.1.0"
edition = "2021"
description = "GPU (CUDA) NTT and Poseidon2 Merkle backends for the Rand zkVM, with CPU reference twins"

[lib]
name = "rand_zkvm_cuda"
path = "src/lib.rs"

[dependencies]
p3-field = "=0.7.0"
p3-dft = "=0.7.0"
p3-matrix = "=0.7.0"
p3-commit = "=0.7.0"
p3-merkle-tree = "=0.7.0"
p3-goldilocks = "=0.7.0"
p3-poseidon2 = "=0.7.0"
p3-symmetric = "=0.7.0"
p3-util = "=0.7.0"
rand = { version = "0.10", features = ["std_rng"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
cuda-core = { version = "=0.3.1", optional = true }

[features]
default = []
# `cuda` and `mock-driver` are mutually exclusive: enabling both is a `compile_error!` in
# src/gpu/driver/mod.rs rather than a silent fallback to the host mock.
cuda = ["dep:cuda-core"]
mock-driver = []
cuda-hw = ["cuda"]

[dev-dependencies]
p3-fri = "=0.7.0"
postcard = { version = "1", features = ["alloc"] }
