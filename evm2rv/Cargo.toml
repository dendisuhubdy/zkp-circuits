[package]
name = "evm2rv"
version = "0.1.0"
edition = "2021"
description = "Translates EVM bytecode (solc's runtime bytecode) into C over evm-rt/, for rand-guest to build into a zkVM image"

[lib]
path = "src/lib.rs"

[[bin]]
name = "evm2rv"
path = "src/main.rs"

[dependencies]
evm-core = { path = "../guests-compiled/evm-core" }
clap = { version = "4.4", features = ["derive"] }
anyhow = "1"
hex = "0.4"
# The machine's own Poseidon2 sponge (`hash::sponge_hash`), for the code guard's digest
# (`guard::code_digest`), as sbpf2rv's ELF guard uses it. Also the tests' oracle: research's ERC-20
# fixtures (`rand_zkvm::evm`) and the interpreter run natively over them (`EvmCall::expected`).
rand_zkvm = { path = "../research" }

[dev-dependencies]
# `ffi.rs`'s halt-code table, which the parity test's `emit-outcome` build reports its halt in.
evm-core = { path = "../guests-compiled/evm-core", features = ["ffi"] }

# Its own workspace root, like every guest crate: never swept into research's cargo test.
[workspace]

# The oracle's Keccak and Poseidon2 are research's reference code; optimise the dependencies even
# in a test build, as research's own manifest does.
[profile.dev.package."*"]
opt-level = 3
