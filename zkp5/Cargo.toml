[package]
name = "zkp5"
version = "0.1.0"
edition = "2021"
description = "Monero-style private transactions: stealth addresses, Pedersen commitments, CLSAG ring signatures, Bulletproofs range proofs, key images"

[dependencies]
curve25519-dalek = { version = "4.1", features = ["digest", "rand_core"] }
bulletproofs = "5"
merlin = "3"
sha2 = "0.10"
rand = "0.8"

[profile.release]
opt-level = 3
