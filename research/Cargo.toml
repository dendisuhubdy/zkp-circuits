[package]
name = "rand_zkvm"
version = "0.1.0"
edition = "2021"
description = "Rand Protocol reference zkVM: RV32I under a zero-knowledge batch STARK (Plonky3, Goldilocks)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "rand_zkvm"
path = "src/main.rs"

[dependencies]
p3-air = "=0.7.0"
p3-uni-stark = "=0.7.0"
p3-batch-stark = "=0.7.0"
p3-lookup = "=0.7.0"
p3-goldilocks = "=0.7.0"
p3-poseidon2 = "=0.7.0"
p3-field = "=0.7.0"
p3-matrix = "=0.7.0"
p3-challenger = "=0.7.0"
p3-commit = "=0.7.0"
p3-fri = "=0.7.0"
p3-dft = "=0.7.0"
p3-merkle-tree = "=0.7.0"
p3-symmetric = "=0.7.0"
p3-keccak = "=0.7.0"
rand = { version = "0.10", features = ["std_rng"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
ml-kem = "=0.3.2"
chacha20poly1305 = "=0.11.0"
rand-zkvm-cuda = { path = "../rand-zkvm-cuda", optional = true }
# The EVM interpreter core (M4.3): a no_std library with its own workspace root, compiled into the
# `evm` guest on riscv32im and run natively here. A normal dependency, not a dev-dependency, because
# `src/evm.rs` (the host side of the storage tree: `HostRef`, `SparseTree`) is part of the library —
# `tests/evm_*.rs` link `rand_zkvm` as an external crate, so a dev-dependency could not appear in its
# public API.
evm-core = { path = "../guests-compiled/evm-core" }

[dev-dependencies]
hex = "0.4"
# The oracle for `evm-core`'s 256-bit arithmetic — host tests only, never in a guest.
num-bigint = "0.4"
# The oracle for `evm-core`'s opcode semantics and gas (`tests/evm_interp.rs`) — host tests only,
# never in a guest. Pinned exactly; `default-features = false` keeps the precompile crates' C
# dependencies (blst, c-kzg, secp256k1) out of the build, since only the bare interpreter is used.
revm = { version = "=43.0.2", default-features = false, features = ["std"] }

[features]
default = []
# The GPU backend's CPU-twin engines: same Merkle/NTT code paths, no device needed.
reference-backend = ["dep:rand-zkvm-cuda"]
# `cuda` and `mock-cuda` are mutually exclusive: enabling both is a hard `compile_error!` in
# rand-zkvm-cuda, so the host mock can never be silently substituted for the GPU.
# `Backend::Cuda` against a real device. Pulls `cuda-core`, which needs a CUDA 13 toolkit
# at build time.
cuda = ["dep:rand-zkvm-cuda", "rand-zkvm-cuda/cuda"]
# `Backend::Cuda` end to end on the mock driver: the same kernel bodies run on the host.
# Deliberately *not* `["cuda", ...]` — `rand-zkvm-cuda/cuda` is what pulls `cuda-core`, so
# enabling it would put a CUDA toolkit back in the way of a no-GPU test run. The two features
# are siblings; either one turns on `Backend::Cuda`.
mock-cuda = ["dep:rand-zkvm-cuda", "rand-zkvm-cuda/mock-driver"]

[profile.release]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 1
