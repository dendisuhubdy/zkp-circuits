[package]
name = "sbpf2rv"
version = "0.1.0"
edition = "2021"
description = "Translates an sBPF ELF into C that runs natively in the Rand zkVM (scanner + emitter)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "sbpf2rv"
path = "src/main.rs"

[dependencies]
sbpf-core = { path = "../guests-compiled/sbpf-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# The machine's own Poseidon2 sponge (`hash::sponge_hash`), for the ELF guard's digest
# (`shim::view_digest`). Also the parity test's oracle: `SbpfCall` (the SPL Token vectors and their
# two input segments) and `HostRef`, the same fixtures the interpreter's own tests use.
rand_zkvm = { path = "../research" }

# Its own workspace root, like every crate here (guests-compiled/sbpf-core, rand-guest, …): never
# swept into research's or circuits' own cargo test/build.
[workspace]
